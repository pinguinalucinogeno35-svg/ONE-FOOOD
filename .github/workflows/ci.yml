name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tipos
        run: pnpm typecheck

      - name: Sobe Postgres, PgBouncer e Redis
        run: docker compose up -d --wait

      # Os testes de integração rodam contra Postgres de verdade, através do PgBouncer
      # em modo transação, e aplicam as migrações no banco de teste antes de começar.
      - name: Testes
        run: pnpm test

      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color

  e2e:
    name: Ponta a ponta no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sobe Postgres, PgBouncer e Redis
        run: docker compose up -d --wait

      - name: Instala o navegador
        run: pnpm --filter @onefood/e2e exec playwright install --with-deps chromium

      # Sobe API, workers, tempo real e site de verdade e percorre os fluxos num navegador:
      # cadastro, cardápio, pedido do cliente, painel ao vivo e acesso.
      - name: Testes de ponta a ponta
        run: pnpm test:e2e

      - name: Guarda as capturas de tela das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falhas
          path: apps/e2e/test-results
          retention-days: 7

      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color

  imagem:
    name: Imagem do backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t onefood-api:${{ github.sha }} .
      - name: A imagem sobe e encontra as migrações
        run: |
          docker run --rm onefood-api:${{ github.sha }} node -e "
            const fs = require('node:fs');
            const files = fs.readdirSync(process.env.MIGRATIONS_DIR);
            if (files.length === 0) throw new Error('sem migrações na imagem');
            for (const entry of ['main.api.js', 'main.worker.js', 'main.realtime.js', 'migrate.js', 'telemetry.js']) {
              if (!fs.existsSync('dist/' + entry)) throw new Error('faltou dist/' + entry);
            }
            console.log('ok:', files.length, 'migrações');
          "
