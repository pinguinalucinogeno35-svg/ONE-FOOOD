; PgBouncer de desenvolvimento e CI, em modo transação como em produção.
; Em modo transação a conexão volta ao pool a cada COMMIT: nada de estado de sessão
; (SET, LISTEN, prepared statements nomeados). O tenant é fixado com SET LOCAL.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
