# Dependências locais de desenvolvimento e do CI. Não é a topologia de produção:
# lá o Postgres é gerenciado, com réplica síncrona em outra zona, e cache e filas
# ficam em instâncias Redis separadas.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/dev/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onefood_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    build: ./infra/pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    # Filas não podem perder chaves: nunca use política de descarte na instância de filas.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
